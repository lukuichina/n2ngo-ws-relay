syntax = "proto3";

package n2n;

option go_package = "n2n-go/pkg/protocol/netstruct";

// 对应 Go 中的 SNPublicSecret
message SnPublicSecret {
  bool is_request = 1;
  bytes pem_data = 2;
}

// 对应 Go 中的 RegisterRequest
message RegisterRequest {
  string edge_mac_addr = 1;
  string edge_desc = 2;
  string community_name = 3;
  bytes encrypted_machine_id = 4;
  bytes clear_machine_id = 5;
  string p2p_endpoint = 6;
  repeated string p2p_capabilities = 7;
}

// 对应 Go 中的 RegisterResponse
message RegisterResponse {
  bool is_register_ok = 1;
  string virtual_ip = 2;
  int32 masklen = 3;
  bytes sn_public_key = 4;
  string community_name = 5;
  string assigned_mac = 6;
  repeated PeerInfo peers = 7;
}

// 对应 Go 中的 PeerInfo (p2p.proto)
message PeerInfo {
  string virtual_ip = 1;
  bytes mac_addr = 2;
  string pub_socket = 3;
  string community = 4;
  string desc = 5;
  string p2p_endpoint = 6;
  repeated string p2p_capabilities = 7;
  string nat_type = 8;
  uint64 last_seen = 9;
}

// 对应 Go 中的 PeerInfoList (p2p.proto)
message PeerInfoList {
  bool has_origin = 1;
  PeerInfo origin = 2;
  repeated PeerInfo peer_infos = 3;
  uint32 event_type = 4;
}

// ICE Candidate 信令消息
message ICECandidate {
  string target_mac = 1;
  string candidate = 2;
  string sdp_mid = 3;
  uint32 sdp_mline_index = 4;
}

// TURN 凭证消息
message TURNCredentials {
  string username = 1;
  string password = 2;
  uint32 ttl = 3;
  repeated string uris = 4;
}

// 对应 Go 中的 LeasesInfos
message IppoolLease {
  bytes ip = 1;
  string mac = 2;
  int64 expiry_ns = 3;
  bool sticky = 4;
  int64 last_renew_ns = 5;
}

message LeaseEdgeInfos {
  string edge_id = 1;
  bool is_registered = 2;
  int64 time_since_last_update_ns = 3;
  bytes virtual_ip = 4;
}

message LeaseWithEdgeInfos {
  IppoolLease lease = 1;
  LeaseEdgeInfos lease_edge_infos = 2;
}

message LeasesInfos {
  bool is_request = 1;
  string community_name = 2;
  map<string, LeaseWithEdgeInfos> leases_with_edges_infos = 3;
}